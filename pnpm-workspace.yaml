packages:
  - playground
  # One framework world per package: `h3`, `cookie-es` and an `unjwt` copy whose peers
  # resolve to that h3 major. Tests and type-checking resolve from them, not the root.
  - test/env-*

catalog:
  unjwt: https://pkg.pr.new/sandros94/unjwt@7b32b79

allowBuilds:
  "@parcel/watcher": false
  esbuild: false
  simple-git-hooks: true

ignoredBuiltDependencies:
  - "@parcel/watcher"
  - esbuild
onlyBuiltDependencies:
  - simple-git-hooks

minimumReleaseAgeExclude:
  - unsecure
  - unjwt
