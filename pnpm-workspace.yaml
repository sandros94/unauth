packages:
  - playground

allowBuilds:
  "@parcel/watcher": false
  esbuild: false
  simple-git-hooks: true

ignoredBuiltDependencies:
  - "@parcel/watcher"
  - esbuild
onlyBuiltDependencies:
  - simple-git-hooks

minimumReleaseAgeExclude:
  - unsecure
  - unjwt

patchedDependencies:
  unjwt@0.7.3: patches/unjwt@0.7.3.patch
