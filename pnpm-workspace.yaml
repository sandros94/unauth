packages:
  - playground

allowBuilds:
  "@parcel/watcher": false
  esbuild: false
  simple-git-hooks: true

ignoredBuiltDependencies:
  - "@parcel/watcher"
  - esbuild
onlyBuiltDependencies:
  - simple-git-hooks

minimumReleaseAgeExclude:
  - unsecure
  - unjwt
patchedDependencies:
  unjwt@0.8.1: patches/unjwt@0.8.1.patch
